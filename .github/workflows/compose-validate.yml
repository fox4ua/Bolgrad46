name: Validate Compose rebuild

on:
  push:
    branches: [ "compose-reference-rebuild" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recreate project source
        shell: bash
        run: |
          rm -rf validation
          mkdir -p validation
          cd validation
          echo '' | base64 --decode | tar -xz --strip-components=1
          mkdir -p app/src/main/res/drawable-nodpi
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAFElEQVR4nGMU0XBjwAaYsIoOWgkAa2IAkt1UtOQAAAAASUVORK5CYII=' | base64 --decode > app/src/main/res/drawable-nodpi/house_camera.png

      - name: Generate official Gradle wrapper
        working-directory: validation
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        working-directory: validation
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload validated project
        uses: actions/upload-artifact@v4
        with:
          name: Bolgrad46Compose-validated
          path: validation/
          if-no-files-found: error
          retention-days: 7
