name: Build Android APK

on:
  push:
    branches: [ "main", "master", "ui-rebuild-reference" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare house image resource
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode app/src/main/res/raw/house46_hero_base64.txt > app/src/main/res/drawable-nodpi/house46_runtime.webp
          test -s app/src/main/res/drawable-nodpi/house46_runtime.webp

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bolgrad46-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
