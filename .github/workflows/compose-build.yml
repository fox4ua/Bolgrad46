name: Build Compose APK

on:
  push:
    branches: [ "compose-apk-build" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild project archive
        run: |
          cat chunks/chunk0.b64 chunks/chunk1.b64 chunks/chunk2.b64 chunks/chunk3.b64 chunks/chunk4.b64 > project.b64
          base64 --decode project.b64 > Bolgrad46Compose-ready.zip
          echo "a63812f7d88f3e0b956de74b1d6ad8e06810fe9b577614893fa30e4e7e702dc2  Bolgrad46Compose-ready.zip" | sha256sum -c -

      - name: Extract project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q Bolgrad46Compose-ready.zip -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: extracted/Bolgrad46Compose
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bolgrad46Compose-debug-apk
          path: extracted/Bolgrad46Compose/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
