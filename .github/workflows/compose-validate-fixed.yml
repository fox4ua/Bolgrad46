name: Validate fixed Compose rebuild

on:
  push:
    branches: [ "compose-reference-rebuild" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recreate final source project
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import pathlib
          import shutil
          import tarfile
          import tempfile

          workflow = pathlib.Path('.github/workflows/compose-validate.yml').read_text()
          encoded = None
          for line in workflow.splitlines():
              marker = "echo '"
              suffix = "' | base64 --decode | tar -xz --strip-components=1"
              if marker in line and suffix in line:
                  encoded = line.split(marker, 1)[1].split(suffix, 1)[0]
                  break
          if encoded is None:
              raise SystemExit('Embedded project archive not found')

          target = pathlib.Path('validation')
          if target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True)

          raw = base64.b64decode(encoded)
          with tempfile.NamedTemporaryFile(suffix='.tar.gz') as archive:
              archive.write(raw)
              archive.flush()
              with tarfile.open(archive.name, 'r:gz') as tar:
                  tar.extractall(target)

          project = target / 'Bolgrad46Compose'
          source = project / 'app/src/main/java/ua/bolgrad/smarthome/ui/SmartHomeScreen.kt'
          text = source.read_text()
          opt_in = '@file:OptIn(androidx.compose.foundation.ExperimentalFoundationApi::class)'
          if not text.startswith(opt_in):
              text = opt_in + '\n\n' + text

          duplicate_badge = '''        OnlineBadge(\n            modifier = Modifier\n                .align(Alignment.TopStart)\n                .padding(\n                    start = (22f * scale).dp,\n                    top = (22f * scale).dp\n                ),\n            scale = scale\n        )\n\n'''
          text = text.replace(duplicate_badge, '', 1)
          source.write_text(text)
          PY

          mkdir -p validation/Bolgrad46Compose/app/src/main/res/drawable-nodpi
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAFElEQVR4nGMU0XBjwAaYsIoOWgkAa2IAkt1UtOQAAAAASUVORK5CYII=' | base64 --decode > validation/Bolgrad46Compose/app/src/main/res/drawable-nodpi/house_camera.png

      - name: Generate official Gradle wrapper
        working-directory: validation/Bolgrad46Compose
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        working-directory: validation/Bolgrad46Compose
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload validated project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bolgrad46Compose-final-validated
          path: validation/Bolgrad46Compose/
          if-no-files-found: error
          retention-days: 7
