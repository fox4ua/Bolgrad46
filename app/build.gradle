plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.kharkiv.bolgrad46'
    compileSdk 35

    defaultConfig {
        applicationId 'ua.kharkiv.bolgrad46'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.2.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
